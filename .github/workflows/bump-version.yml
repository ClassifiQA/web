name: Release and deploy

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: bump-semantic-version-main
  cancel-in-progress: false

jobs:
  bump-version:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.release.outputs.sha }}
      release_version: ${{ steps.release.outputs.version }}

    steps:
      - name: Check out the pushed revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine commits in this push
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            git log -1 --format='%B' "$AFTER_SHA" > "$RUNNER_TEMP/commit-messages.txt"
          else
            if ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              git fetch --no-tags origin "$BEFORE_SHA" || true
            fi

            if git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              git log --format='%B' "$BEFORE_SHA..$AFTER_SHA" > "$RUNNER_TEMP/commit-messages.txt"
            else
              echo "::warning::The previous main revision is unavailable; using only the pushed head commit for version classification."
              git log -1 --format='%B' "$AFTER_SHA" > "$RUNNER_TEMP/commit-messages.txt"
            fi
          fi

      - name: Test versioning rules
        run: node --test .github/scripts/bump-version.test.mjs

      - name: Bump and push the version
        id: release
        env:
          COMMIT_MESSAGES: ${{ runner.temp }}/commit-messages.txt
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          existing_release=$(git log origin/main \
            --format='%H' \
            --fixed-strings \
            --grep="Release-Source: ${SOURCE_SHA}" \
            -1)

          if [[ -n "$existing_release" ]]; then
            release_version=$(git show "${existing_release}:package.json" \
              | node -e 'const fs = require("node:fs"); console.log(JSON.parse(fs.readFileSync(0, "utf8")).version)')
            echo "Reusing existing release v${release_version} (${existing_release})"
            echo "sha=${existing_release}" >> "$GITHUB_OUTPUT"
            echo "version=${release_version}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B version-bump origin/main
            node .github/scripts/bump-version.mjs "$COMMIT_MESSAGES"

            next_version=$(node -p "require('./package.json').version")
            git add package.json
            git commit \
              -m "chore(release): v${next_version}" \
              -m "Release-Source: ${SOURCE_SHA}"

            if git push origin HEAD:main; then
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              echo "version=${next_version}" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "main changed while versioning; retrying (${attempt}/5)"
          done

          echo "Could not push the version after 5 attempts" >&2
          exit 1

  deploy:
    name: Deploy to Coolify
    needs: bump-version
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check that the release is still current
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.bump-version.outputs.release_sha }}
          RELEASE_VERSION: ${{ needs.bump-version.outputs.release_version }}
        run: |
          current_main_sha=$(gh api \
            "repos/${GITHUB_REPOSITORY}/commits/main" \
            --jq '.sha')

          if [[ "$current_main_sha" == "$RELEASE_SHA" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping v${RELEASE_VERSION}; main has a newer commit that will be released by its queued workflow."
          fi

      - name: Deploy to Coolify
        if: steps.release.outputs.deploy == 'true'
        uses: ChristopheCVB/coolify-deploy-action@v3.1.0
        with:
          token: ${{ secrets.COOLIFY_TOKEN }}
          domain: backend.danfq.dev
          uuid: ${{ secrets.COOLIFY_UUID }}
